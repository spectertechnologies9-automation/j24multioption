<style>
/* Layout: one centred phone-width column. The logo sits on a ringed "tap point", two large
   slanted action tiles carry the priority actions, and everything else is a quiet grouped list. */
:root {
  --bg: #f2f5ef;
  --surface: #ffffff;
  --surface-2: #e9eee5;
  --ink: #10150e;
  --muted: #5a6656;
  --line: #dbe2d5;
  --green: #5fae43;        /* sampled from the logo */
  --green-ink: #2f7a1c;    /* green that stays readable as text */
  --on-green: #0b1408;
  --tile-dark: #10150e;
  --on-tile-dark: #ffffff;
  --star: #f2b01e;
  --danger: #b3261e;
  --scrim: rgba(12, 18, 10, .5);
  --shadow: 0 1px 2px rgba(16, 40, 8, .06), 0 10px 28px -12px rgba(16, 40, 8, .22);
  --display: "Avenir Next", "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Palatino, "Noto Serif", Georgia, serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.3, 1.5, .5, 1);
  --r-lg: 26px;
  --r-md: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0f0b; --surface: #161b14; --surface-2: #1f261c; --ink: #f0f4ec; --muted: #9aa894;
    --line: #283024; --green: #6cbd4e; --green-ink: #86d267; --on-green: #081005;
    --tile-dark: #f0f4ec; --on-tile-dark: #0c0f0b; --danger: #ff8a80;
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0f0b; --surface: #161b14; --surface-2: #1f261c; --ink: #f0f4ec; --muted: #9aa894;
  --line: #283024; --green: #6cbd4e; --green-ink: #86d267; --on-green: #081005;
  --tile-dark: #f0f4ec; --on-tile-dark: #0c0f0b; --danger: #ff8a80;
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.page {
  max-width: 460px; margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-bottom, 0px) + 32px);
  display: flex; flex-direction: column; gap: 22px;
}

/* ── Hero ─────────────────────────────────────────── */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; position: relative; }
.tap { position: relative; width: 132px; height: 132px; display: grid; place-items: center; margin-bottom: 14px; }
.tap img {
  width: 112px; height: 112px; border-radius: 30px; object-fit: cover; position: relative; z-index: 1;
  box-shadow: var(--shadow); background: var(--surface-2);
  animation: logo-in .6s cubic-bezier(.2, .9, .25, 1.15) both;
}
.ring {
  position: absolute; inset: 10px; border-radius: 36px; border: 2px solid var(--green); opacity: 0;
  animation: ring 3.6s cubic-bezier(.2, .6, .3, 1) infinite;
}
.ring:nth-child(2) { animation-delay: .45s; }
.ring:nth-child(3) { animation-delay: .9s; }
@keyframes ring { 0% { transform: scale(.92); opacity: 0; } 12% { opacity: .55; } 55%, 100% { transform: scale(1.5); opacity: 0; } }
@keyframes logo-in { from { transform: scale(.82); opacity: 0; } to { transform: none; opacity: 1; } }

.welcome { font-size: 14px; color: var(--muted); margin: 0; }
.hero h1 {
  margin: 0; font: italic 900 46px/1 var(--display); letter-spacing: -.03em; text-wrap: balance;
}
.tagline { margin: 6px 0 0; font-size: 17px; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg.i { width: 16px; height: 16px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.is-open { color: var(--green-ink); font-weight: 600; }
.is-open .dot { background: var(--green); }

/* Tap → Open → Connect: a real sequence, the first two steps are already done on arrival */
.steps { list-style: none; margin: 16px 0 0; padding: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps li + li::before { content: ""; width: 18px; height: 2px; border-radius: 2px; background: var(--line); margin-right: 2px; }
.steps .done { color: var(--ink); }
.steps .tick { width: 16px; height: 16px; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; }
.steps .tick svg { width: 10px; height: 10px; stroke-width: 3.2; }
.steps .now { color: var(--green-ink); }
.steps .now .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.6); opacity: .45; } }

/* ── Priority tiles ───────────────────────────────── */
.prime { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  position: relative; overflow: hidden; min-height: 148px; padding: 16px; border-radius: var(--r-lg);
  display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
  box-shadow: var(--shadow); transition: transform .16s ease;
}
.tile:active, .row:active, .chip:active, .btn:active { transform: scale(.97); }
.tile::after { /* speed streak borrowed from the logo */
  content: ""; position: absolute; right: -30px; top: -20px; width: 90px; height: 200%;
  background: currentColor; opacity: .07; transform: skewX(-18deg);
}
.tile-rate { background: var(--green); color: var(--on-green); }
.tile-wifi { background: var(--tile-dark); color: var(--on-tile-dark); }
.tile svg.i { width: 30px; height: 30px; }
.tile b { display: block; font: italic 800 21px/1.1 var(--display); letter-spacing: -.01em; }
.tile small { display: block; margin-top: 4px; font-size: 13px; opacity: .8; line-height: 1.3; }
.tile .mini-stars { display: flex; gap: 1px; }
.tile .mini-stars svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }

/* ── Grouped list ─────────────────────────────────── */
.group { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 16px;
  transition: transform .16s ease, background .16s ease;
}
.row + .row { border-top: 1px solid var(--line); }
.row .ico { width: 42px; height: 42px; border-radius: 14px; background: var(--surface-2); color: var(--green-ink); display: grid; place-items: center; flex: none; }
.row .txt { flex: 1; min-width: 0; }
.row b { display: block; font-weight: 650; font-size: 16px; }
.row small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .go { color: var(--muted); width: 18px; height: 18px; }
@media (hover: hover) { .row:hover { background: var(--surface-2); } .tile:hover { transform: translateY(-2px); } }

/* ── More ─────────────────────────────────────────── */
.more h2, .sheet h2 { font: italic 800 20px/1.15 var(--display); margin: 0; letter-spacing: -.01em; }
.more { display: flex; flex-direction: column; gap: 12px; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chip {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); min-height: 84px; padding: 12px 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-size: 13px; font-weight: 600; text-align: center; line-height: 1.2; transition: transform .16s ease;
}
.chip svg.i { color: var(--green-ink); }
.foot { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 0; }

/* ── Sheet ────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; opacity: 0; transition: opacity .25s ease; display: flex; align-items: flex-end; justify-content: center; }
.scrim.on { opacity: 1; }
.sheet {
  width: 100%; max-width: 460px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 28px 28px 0 0;
  padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translateY(100%); transition: transform .34s cubic-bezier(.2, .85, .25, 1);
}
.scrim.on .sheet { transform: none; }
@media (min-width: 520px) { .scrim { align-items: center; } .sheet { border-radius: 28px; } }
.grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 6px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; margin-bottom: 8px; }
.x { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.x svg.i { width: 18px; height: 18px; }
.body { display: flex; flex-direction: column; gap: 14px; animation: body-in .3s ease both; }
@keyframes body-in { from { opacity: 0; transform: translateY(8px); } }
.body p { margin: 0; }
.lead { font-size: 17px; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; }
.center { text-align: center; align-items: center; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; padding: 12px 18px;
  border-radius: 16px; font-weight: 700; font-size: 16px; background: var(--green); color: var(--on-green); transition: transform .16s ease;
}
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn[disabled] { opacity: .55; cursor: default; }
.textlink { color: var(--green-ink); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 8px; }

/* stars */
.stars { display: flex; justify-content: center; gap: 4px; }
.star { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 14px; }
.star svg { width: 40px; height: 40px; fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; stroke-linejoin: round; transition: fill .15s ease, transform .2s cubic-bezier(.3, 1.6, .5, 1); }
.star.lit svg { fill: var(--star); stroke: var(--star); }
.star.pop svg { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 40% { transform: scale(1.32) rotate(-8deg); } }
@media (max-width: 350px) { .star { width: 46px; height: 46px; } .star svg { width: 34px; height: 34px; } }
.heart { font-size: 40px; line-height: 1; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }

label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.f input, .f textarea, .f select {
  width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 16px; font-weight: 400;
}
.f textarea { min-height: 88px; resize: vertical; }
.f input:focus, .f textarea:focus, .f select:focus { outline: none; border-color: var(--green); }
.err { color: var(--danger); font-size: 14px; }

/* wifi */
.kv { background: var(--bg); border-radius: var(--r-md); }
.kv > div { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 8px 8px 14px; }
.kv > div + div { border-top: 1px solid var(--line); }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 650; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.kv .val { flex: 1; min-width: 0; }
.kv button { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--green-ink); flex: none; }
.kv button svg.i { width: 20px; height: 20px; }
.qr { align-self: center; background: #fff; padding: 12px; border-radius: 18px; border: 1px solid var(--line); line-height: 0; }
.qr svg { width: 184px; height: 184px; max-width: 100%; display: block; }

.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; }
.list li + li { border-top: 1px solid var(--line); }
.list small { display: block; color: var(--muted); font-size: 13px; }
.list .today { font-weight: 700; color: var(--green-ink); }
.list span:last-child { text-align: right; font-variant-numeric: tabular-nums; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translate(-50%, 20px); z-index: 20;
  background: var(--tile-dark); color: var(--on-tile-dark); padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; max-width: calc(100% - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ── Review journey ───────────────────────────────────
   Lives inside the existing sheet. Serif for the editorial voice, the page's own sans for controls,
   the logo green for confirmation only. One idea per screen, actions within thumb reach. */
.sheet.rv { display: flex; flex-direction: column; min-height: min(86vh, 700px); min-height: min(86dvh, 700px); }
.sheet.rv #sheet-body { flex: 1; display: flex; flex-direction: column; }
.sheet.rv .body { flex: 1; gap: 0; }
.sheet.rv .sheet-head { margin-bottom: 0; }
.sheet.rv #sheet-title { font: 600 11.5px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

.rv-top { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; flex: 1; padding: 8px 0 56px; }
.rv-top.sm { flex: none; gap: 0; padding: 2px 0 14px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.rv-ask { margin: 0 0 10px; font: 400 33px/1.1 var(--serif); letter-spacing: -.015em; text-align: center; text-wrap: balance; }
.rv-top.sm .rv-ask { display: none; }
.rv-cap { margin: 0; min-height: 24px; font: italic 400 17px/1.4 var(--serif); color: var(--muted); text-align: center; }
.rv-cap.swap { animation: rv-rise .4s var(--ease) both; }
.rv-top.sm .rv-cap { position: absolute; width: 1px; height: 1px; min-height: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.rv-stars { display: flex; justify-content: center; gap: 2px; }
.rv-star { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 50%; transition: width .36s var(--ease), height .36s var(--ease); }
.rv-star svg {
  width: 42px; height: 42px; fill: transparent; stroke: var(--muted); stroke-opacity: .5; stroke-width: 1.05; stroke-linejoin: round;
  transition: fill .26s ease, stroke .26s ease, stroke-opacity .26s ease, filter .3s ease, transform .3s var(--spring), width .36s var(--ease), height .36s var(--ease);
}
.rv-star.lit svg { fill: var(--star); stroke: var(--star); stroke-opacity: 1; filter: drop-shadow(0 5px 9px rgba(242, 176, 30, .3)); }
.rv-star.pop svg { animation: rv-pop .5s var(--spring) both; animation-delay: calc(var(--i) * 42ms); }
.rv-star:active svg { transform: scale(.88); }
@media (hover: hover) { .rv-star:hover svg { transform: scale(1.08); stroke-opacity: .9; } }
.rv-top.sm .rv-star { width: 46px; height: 46px; }
.rv-top.sm .rv-star svg { width: 24px; height: 24px; filter: none; }
@keyframes rv-pop { 0% { transform: scale(.78); } 55% { transform: scale(1.16); } 100% { transform: none; } }
@keyframes rv-rise { from { opacity: 0; transform: translateY(10px); } }

.rv-stage { flex: 1; display: flex; flex-direction: column; gap: 22px; }
.rv-stage:empty { display: none; }
.rv-stage.in > *, .rv-stage.in > form > * { animation: rv-rise .52s var(--ease) both; }
.rv-stage.in > :nth-child(2), .rv-stage.in > form > :nth-child(1) { animation-delay: 60ms; }
.rv-stage.in > :nth-child(3), .rv-stage.in > form > :nth-child(2) { animation-delay: 110ms; }
.rv-stage.in > :nth-child(4), .rv-stage.in > form > :nth-child(3) { animation-delay: 160ms; }
.rv-stage.in > form > :nth-child(n+4) { animation-delay: 200ms; }

.rv-h { margin: 0; font: 400 29px/1.14 var(--serif); letter-spacing: -.012em; text-wrap: balance; }
.rv-h:focus { outline: none; }
.rv-sub { margin: 10px 0 0 !important; color: var(--muted); font-size: 15px; line-height: 1.55; text-wrap: pretty; }
.rv-eyebrow { margin: 0 0 10px !important; font: 600 11.5px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--green-ink); }

.rv-set { display: flex; flex-direction: column; gap: 12px; }
.rv-lab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0; font-size: 15px; font-weight: 650; }
.rv-lab i { flex: none; font-style: normal; font-weight: 400; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.rv-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.rv-tag {
  display: inline-flex; align-items: center; gap: 9px; min-height: 46px; padding: 0 16px 0 12px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 15px; font-weight: 500; line-height: 1.2;
  transition: background .24s ease, color .24s ease, border-color .24s ease, box-shadow .24s ease, transform .24s var(--spring);
}
.rv-tag .ck { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: background .24s ease, border-color .24s ease; }
.rv-tag .ck svg { width: 12px; height: 12px; fill: none; stroke: var(--on-green); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 12; stroke-dashoffset: 12; transition: stroke-dashoffset .28s var(--ease) .04s; }
.rv-tag[aria-pressed="true"] { background: var(--tile-dark); color: var(--on-tile-dark); border-color: var(--tile-dark); box-shadow: 0 8px 16px -10px rgba(16, 40, 8, .55); transform: translateY(-1px); }
.rv-tag[aria-pressed="true"] .ck { background: var(--green); border-color: var(--green); }
.rv-tag[aria-pressed="true"] .ck svg { stroke-dashoffset: 0; }
.rv-tag:active { transform: scale(.96); }
@media (hover: hover) { .rv-tag:hover { border-color: var(--muted); } }

.rv-field {
  display: block; width: 100%; min-height: 104px; padding: 14px 16px; resize: none;
  border: 1px solid var(--line); border-radius: 16px; background: var(--bg); font-size: 16px; line-height: 1.5;
  transition: border-color .2s ease, box-shadow .2s ease;
}
input.rv-field { min-height: 54px; }
.rv-field::placeholder { color: var(--muted); opacity: .75; }
.rv-field:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(95, 174, 67, .16); }

.rv-actions { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
.rv-actions .textlink { align-self: center; text-align: center; min-height: 44px; display: inline-flex; align-items: center; }
.rv-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rv-row .btn { font-size: 14.5px; font-weight: 650; padding: 10px 8px; line-height: 1.2; text-align: center; }
.rv-note { margin: 0 !important; text-align: center; font-size: 13px; color: var(--muted); }

.rv-gen { flex: 1; min-height: 320px; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 2px 40px; }
.rv-gen p { margin: 0; font: 400 25px/1.2 var(--serif); letter-spacing: -.01em; opacity: 0; transform: translateY(8px); transition: opacity .36s ease, transform .46s var(--ease); }
.rv-gen p.on { opacity: 1; transform: none; }
.rv-gen p.was { opacity: .32; transform: none; }
.rv-bar { height: 2px; margin-top: 14px; border-radius: 2px; background: var(--line); overflow: hidden; }
.rv-bar i { display: block; height: 100%; background: var(--green); transform: scaleX(0); transform-origin: left; transition: transform .46s var(--ease); }

.rv-card { position: relative; margin: 0; padding: 30px 22px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 22px; transition: border-color .2s ease, box-shadow .2s ease; }
.rv-card.editing { border-color: var(--green); box-shadow: 0 0 0 4px rgba(95, 174, 67, .16); }
.rv-q { display: block; height: 24px; font: 400 66px/.62 var(--serif); color: var(--green-ink); user-select: none; -webkit-user-select: none; }
.rv-text { display: block; width: 100%; margin: 0; padding: 0; border: 0; background: transparent; resize: none; font: 400 19px/1.56 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
textarea.rv-text { outline: none; overflow: hidden; }
.rv-card.sel .rv-text { user-select: all; -webkit-user-select: all; }
.rv-card figcaption { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
.rv-mini { display: inline-flex; gap: 2px; }
.rv-mini svg { width: 14px; height: 14px; fill: var(--line); }
.rv-mini svg.on { fill: var(--star); }

.rv-end { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 12px 0 20px; }
.rv-done { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--green-ink); }
.rv-done svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: rv-draw .55s .2s var(--ease) forwards; }
@keyframes rv-draw { to { stroke-dashoffset: 0; } }
.rv-steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; }
.rv-steps li { counter-increment: s; display: flex; align-items: baseline; gap: 14px; padding: 12px 0; font-size: 15px; }
.rv-steps li + li { border-top: 1px solid var(--line); }
.rv-steps li::before { content: counter(s); flex: none; width: 14px; font: italic 400 18px/1 var(--serif); color: var(--green-ink); }

@media (max-width: 350px) {
  .rv-star { width: 52px; height: 52px; }
  .rv-star svg { width: 36px; height: 36px; }
  .rv-ask { font-size: 28px; }
  .rv-h { font-size: 26px; }
  .rv-gen p { font-size: 22px; }
  .rv-row { grid-template-columns: 1fr; }
}

.rv-top[hidden] + .rv-stage { padding-top: 16px; }
/* keep confirmations clear of the action buttons while the review sheet is open */
.scrim.on:has(.sheet.rv) ~ .toast { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 18px); }

@media (max-width: 350px) {
  .hero h1 { font-size: 40px; }
  .tile { padding: 14px; min-height: 140px; }
  .tile b { font-size: 19px; }
  .chips { gap: 8px; }
  .sheet { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rv-done svg { stroke-dashoffset: 0; }
}
</style>

<body>

<main class="page" id="app">
  <header class="hero">
    <div class="tap" aria-hidden="true">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <img id="logo" alt="" width="112" height="112">
    </div>
    <p class="welcome" id="welcome"></p>
    <h1 id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="meta" id="meta"></div>

      RV.review = el.value.trim();
      const p = document.createElement("p"); p.className = "rv-text"; p.id = "rv-text"; p.textContent = RV.review;
      el.replaceWith(p); card.classList.remove("editing"); btn.textContent = "Edit review";
    } else {
      const ta = document.createElement("textarea"); ta.className = "rv-text"; ta.id = "rv-text"; ta.maxLength = 1500; ta.rows = 1;
      ta.setAttribute("aria-label", "Your review"); ta.value = RV.review;
      el.replaceWith(ta); card.classList.add("editing"); btn.textContent = "Done editing";
      grow(ta); ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }
  /* Copy first, then open Google in the same tap so mobile browsers allow both. */
  function goGoogle() {
    const el = $("rv-text"); if (el && el.tagName === "TEXTAREA") RV.review = el.value;
    const text = RV.review.trim();
    const copied = text ? copy(text, "Review copied.") : Promise.resolve(false);
    let opened = false;
    try { const w = window.open(C.googleReviewUrl, "_blank"); if (w) { opened = true; try { w.opener = null; } catch (e) {} } } catch (e) {}
    copied.then((ok) => handoff(ok, opened, text));
  }
  function handoff(ok, opened, text) {
    const head = !text ? ["Over to Google.", "Write your review there in your own words."]
      : ok ? ["Review copied.", "Your review has been copied. Paste it into Google."]
      : ["One more step.", "We couldn't copy it automatically. Press and hold the text below to copy it, then paste it into Google."];
    setStage('<div class="rv-end">' + (ok ? doneMark : "") + '<div><h3 class="rv-h">' + head[0] + '</h3><p class="rv-sub">' + head[1] + "</p></div>" +
      (text ? '<ol class="rv-steps"><li>Choose your stars on Google</li><li>Press and hold the text box, then tap Paste</li><li>Tap Post</li></ol>' : "") +
      (text && !ok ? '<figure class="rv-card sel"><p class="rv-text">' + esc(text) + "</p></figure>" : "") + "</div>" +
      '<div class="rv-actions"><a class="btn" id="google-review" href="' + esc(C.googleReviewUrl) + '" target="_blank" rel="noopener">' + (opened ? "Open Google again" : "Continue to Google") + "</a>" +
      (text ? '<div class="rv-row"><button class="btn ghost" type="button" data-act="rv-copy">Copy again</button><button class="btn ghost" type="button" data-act="rv-result">Back to review</button></div>' : "") +
      '<button class="textlink" type="button" data-act="close">Done</button></div>', { hideTop: true, focus: true });
  }
  document.addEventListener("input", (e) => {
    const el = e.target, id = el && el.id;
    if (id === "rv-note") RV.note = el.value;
    else if (id === "fb-more") RV.more = el.value;
    else if (id === "fb-contact") RV.contact = el.value;
    else if (id === "rv-text") { RV.review = el.value; grow(el); }
  });

  /* ── Wi-Fi ── */
  const wEsc = (s) => String(s).replace(/([\\;,:"])/g, "\\$1");
  function wifiString() {
    const w = C.wifi, t = /^(nopass|none|open)$/i.test(w.security || "") || !w.password ? "nopass" : /wep/i.test(w.security) ? "WEP" : "WPA";
    return "WIFI:T:" + t + ";S:" + wEsc(w.ssid) + ";" + (t === "nopass" ? "" : "P:" + wEsc(w.password) + ";") + (w.hidden ? "H:true;" : "") + ";";
  }
  function qrSvg(text) {
    const q = qrcode(0, "M"); q.addData(text, "Byte"); q.make();
    const n = q.getModuleCount(), m = 2; let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
    return '<svg viewBox="0 0 ' + (n + m * 2) + " " + (n + m * 2) + '" shape-rendering="crispEdges" role="img" aria-label="Wi-Fi QR code"><rect width="100%" height="100%" fill="#fff"/><path fill="#000" d="' + d + '"/></svg>';
  }
  function viewWifi() {
    const w = C.wifi, open = wifiString().indexOf("T:nopass") > -1;
    const label = open ? "Open network" : /wep/i.test(w.security) ? "WEP" : "WPA / WPA2";
    openSheet("Guest Wi-Fi",
      '<dl class="kv" style="margin:0">' +
      '<div><div class="val"><dt>Network</dt><dd id="wifi-ssid">' + esc(w.ssid) + '</dd></div><button type="button" data-act="copy-ssid" aria-label="Copy network name">' + icon("copy") + "</button></div>" +
      (open ? "" : '<div><div class="val"><dt>Password</dt><dd id="wifi-pass" data-shown="0">' + "•".repeat(Math.min(12, w.password.length)) + '</dd></div><button type="button" data-act="toggle-pass" aria-label="Show password">' + icon("eye") + "</button></div>") +
      '<div><div class="val"><dt>Security</dt><dd id="wifi-sec">' + label + "</dd></div></div></dl>" +
      (open ? '<button class="btn" type="button" data-act="copy-ssid">' + icon("copy") + "Copy network name</button>"
            : '<button class="btn" type="button" data-act="copy-pass">' + icon("copy") + "Copy password</button>") +
      '<p class="sub center">' + (open ? "Then" : "Then open your Wi-Fi settings,") + " choose <strong>" + esc(w.ssid) + "</strong>" + (open ? " in your Wi-Fi settings." : " and paste.") + "</p>" +
      '<div class="qr" id="wifi-qr">' + qrSvg(wifiString()) + "</div>" +
      '<p class="sub center"><strong>Scan to connect.</strong> Point another phone\'s camera at this code to join without typing.</p>');
  }

  /* ── Contact card ── */
  const vEsc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  function vcard() {
    const L = ["BEGIN:VCARD", "VERSION:3.0", "N:;" + vEsc(C.name) + ";;;", "FN:" + vEsc(C.name), "ORG:" + vEsc(C.name)];
    if (C.phone) L.push("TEL;TYPE=WORK,VOICE:" + C.phone.replace(/[^\d+]/g, ""));
    if (C.whatsapp && digits(C.whatsapp) !== digits(C.phone)) L.push("TEL;TYPE=CELL:" + C.whatsapp.replace(/[^\d+]/g, ""));
    if (C.email) L.push("EMAIL;TYPE=WORK:" + C.email);
    if (C.website) L.push("URL:" + C.website);
    if (C.address) L.push("ADR;TYPE=WORK:;;" + vEsc(C.address) + ";;;;");
    if (C.instagram) L.push("X-SOCIALPROFILE;TYPE=instagram:" + C.instagram);
    if (C.tagline) L.push("NOTE:" + vEsc(C.tagline));
    L.push("END:VCARD"); return L.join("\r\n") + "\r\n";
  }
  function saveContact() {
    const url = URL.createObjectURL(new Blob([vcard()], { type: "text/vcard;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = C.name.replace(/[^\w-]+/g, "_") + ".vcf";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Contact card downloaded");
  }

  /* ── Other sheets ── */
  function viewServices() {
    const items = (C.services || []).map((s) => "<li><span>" + esc(s.name) + (s.note ? "<small>" + esc(s.note) + "</small>" : "") + "</span>" + (s.price ? "<span>" + esc(s.price) + "</span>" : "") + "</li>").join("");
    openSheet(C.menuTitle || "Our services", (items ? '<ul class="list">' + items + "</ul>" : '<p class="sub">Ask us in store for the full list.</p>') +
      (C.menuUrl ? '<a class="btn" href="' + esc(C.menuUrl) + '" target="_blank" rel="noopener">See full menu</a>' : "") +
      (F.whatsapp && C.whatsapp ? '<a class="btn ghost" href="' + esc(waLink("Hi " + C.name + ", do you have this in stock?")) + '" target="_blank" rel="noopener">' + icon("chat") + "Ask if it's in stock</a>" : ""));
  }
  function viewHours() {
    const t = new Date().getDay();
    openSheet("Opening hours", '<ul class="list">' + [1, 2, 3, 4, 5, 6, 0].map((d) => '<li' + (d === t ? ' class="today"' : "") + "><span>" + DAYS[d] + (d === t ? " (today)" : "") + "</span><span>" + fmtDay(C.hours[d]) + "</span></li>").join("") + "</ul>");
  }
  function viewOffers() {
    const o = C.offers || [];
    openSheet("Offers", o.length ? '<ul class="list">' + o.map((x) => "<li><span><b>" + esc(x.title) + "</b><small>" + esc(x.detail) + "</small></span></li>").join("") + "</ul>"
      : '<p class="lead">No offers right now.</p><p class="sub">Tap the card again on your next visit to check.</p>');
  }
  function viewLoyalty() {
    const l = C.loyalty || {};
    openSheet(l.title || "Loyalty", '<p class="lead">' + esc(l.detail || "Ask at the counter to join.") + "</p>" +
      (l.url ? '<a class="btn" href="' + esc(l.url) + '" target="_blank" rel="noopener">Join now</a>' : (F.whatsapp && C.whatsapp ? '<a class="btn" href="' + esc(waLink("Hi " + C.name + ", I'd like to join " + (l.title || "the loyalty program") + ".")) + '" target="_blank" rel="noopener">' + icon("chat") + "Join on WhatsApp</a>" : "")));
  }
  async function share() {
    const data = { title: C.name, text: C.name + (C.tagline ? " · " + C.tagline : ""), url: location.href.split("#")[0] };
    if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    copy(data.url, "Link copied");
  }

  /* ── Actions ── */
  const acts = {
    rate: viewRate, wifi: viewWifi, services: viewServices, hours: viewHours, offers: viewOffers, loyalty: viewLoyalty,
    vcard: saveContact, share: share, close: closeSheet,
    feedback: () => { resetReview(); openSheet(C.name + " · Private feedback", '<div class="rv-stage" id="rv-stage"></div>', true); setStage(feedbackStage("open")); },
    star: (el) => onStar(+el.dataset.n),
    topic: (el) => toggleTag(el, RV.topics),
    tag: (el) => toggleTag(el, RV.tags),
    "rv-create": () => createReview(false),
    "rv-again": () => createReview(true),
    "rv-edit": toggleEdit,
    "rv-go": goGoogle,
    "rv-result": showResult,
    "rv-back": () => { clearTimers(); setStage(builderStage()); },
    "rv-copy": () => copy(RV.review.trim(), "Review copied."),
    "copy-ssid": () => copy(C.wifi.ssid, "Network name copied"),
    "copy-pass": () => copy(C.wifi.password, "Password copied"),
    "toggle-pass": (el) => {
      const dd = $("wifi-pass"), show = dd.dataset.shown !== "1";
      dd.textContent = show ? C.wifi.password : "•".repeat(Math.min(12, C.wifi.password.length));
      dd.dataset.shown = show ? "1" : "0"; el.setAttribute("aria-label", show ? "Hide password" : "Show password");
    }
  };
  document.addEventListener("click", (e) => { const el = e.target.closest("[data-act]"); if (el && acts[el.dataset.act]) acts[el.dataset.act](el); });
  document.addEventListener("submit", (e) => { if (e.target.id === "fb") { e.preventDefault(); sendFeedback(e.target); } });

  // Deep links for separate NFC tags: yourpage/#wifi opens the Wi-Fi sheet, #rate opens the rating.
  const fromHash = () => { const h = location.hash.slice(1); if ({ wifi: 1, rate: 1, hours: 1, offers: 1, services: 1 }[h] && acts[h]) acts[h](); };
  fromHash(); window.addEventListener("hashchange", fromHash);
})();
</script>
</body>
</html>
